<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Aluno</title>
    
    <link href="../static/components/styles/bootstrap.min.css" th:href="@{/components/styles/bootstrap.min.css}" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="../static/components/styles/styles.css" th:href="@{/components/styles/styles.css}">
</head>
<body class="bg-light">

    <header class="bg-primary text-white py-3 fixed-top shadow-sm border-bottom border-light">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0 fw-bold">Cadastrar Novo Aluno</h1>
            <a href="/area-aluno" class="btn btn-danger rounded-pill px-4 fw-bold text-white text-decoration-none">Voltar</a>
        </div>
    </header>

    <div class="mt-5 pt-5"></div>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-white border-bottom-0 pt-4">
                        <h4 class="text-primary fw-bold text-center">Ficha de Cadastro</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <form th:action="@{/salvar-aluno}" th:object="${aluno}" method="post">
                            
                            <h5 class="mb-3 text-muted border-bottom pb-2">Dados do Aluno</h5>
                            <div class="mb-3">
                                <label for="nomeAluno" class="form-label fw-bold">Nome Completo</label>
                                <input type="text" class="form-control" id="nomeAluno" th:field="*{nomeAluno}" required>
                            </div>

                            <div class="mb-3">
                                <label for="dataNascimento" class="form-label fw-bold">Data de Nascimento</label>
                                <input type="date" class="form-control" id="dataNascimento" th:field="*{dataNascimento}" required>
                            </div>

                            <h5 class="mb-3 mt-4 text-muted border-bottom pb-2">Dados do Responsável</h5>
                            <div class="mb-3">
                                <label for="nomeResponsavel" class="form-label fw-bold">Nome do Responsável</label>
                                <input type="text" class="form-control" id="nomeResponsavel" th:field="*{nomeResponsavel}" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="telefoneResponsavel" class="form-label fw-bold">Telefone</label>
                                    <input type="tel" class="form-control" id="telefoneResponsavel" th:field="*{telefoneResponsavel}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="emailResponsavel" class="form-label fw-bold">Email</label>
                                    <input type="email" class="form-control" id="emailResponsavel" th:field="*{emailResponsavel}">
                                </div>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">
                                    <i data-feather="save" class="me-2"></i> SALVAR CADASTRO
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../static/components/scripts/bootstrap.bundle.min.js" th:src="@{/components/scripts/bootstrap.bundle.min.js}"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
