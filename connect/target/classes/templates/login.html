<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Academia Dashboard</title>
    <link th:href="@{/components/styles/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/components/styles/styles.css}" rel="stylesheet">
    <script th:src="@{/components/scripts/bootstrap.bundle.min.js}"></script>

    <style>
        body {
            background-color: #f0f2f5;       
        }
    </style>
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">Perfil do Professor</h1>

            <form id="loginForm" th:action="@{/logar}" method="post">
                <div class="form-group">
                    <label for="username"><b>Email</b></label>
                    <input type="text" name="email_Professor" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="password"><b>Senha</b></label>
                    <input type="password" name="senha_Professor" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary login-button">ACESSAR CONTA</button>

                <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-3">
                <a class="btn btn-outline-danger exit-sm" th:href="@{/sairProf}">Sair</a>
                <a class="btn btn-outline-info cad-sm" th:href="@{/cadastroProf}">Cadastrar-se</a>
                </div>
        </div>
        </form>

    </div>
    </div>
    <div th:if="${erro}" class="error-message">
        <span th:text="${erro}"></span>
    </div>
</body>

</html>
