<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/components/styles/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/components/styles/styles.css}" rel="stylesheet">
    <title>Página de Cadastro</title>
    <style>


    </style>
</head>
<body class="cadastro-body">

    <div class="formCad-container">
        
        <form id="cadastro-form" method="post">
            <h2 class="h2cad">Novo Professor</h2>
			<div th:if="${erro}" style="color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center;">
			        <span th:text="${erro}"></span>
			    </div>
            <div class="input-group">
                <label for="cadastro-nome">Nome Completo</label>
                <input type="text" id="cadastro-nome" name="nome_Professor" required>
            </div>
            <div class="input-group">
                <label for="cadastro-email">Email</label>
                <input type="text" id="cadastro-email" name="email_Professor" required>
            </div>
			<div class="input-group">
			    <label for="cadastro-email">CPF</label>
			    <input type="text" id="cadastro-email" name="cpf_Professor" required>
			</div>
			<div class="input-group">
			    <label for="cadastro-email">Telefone</label>
			    <input type="text" id="cadastro-email" name="telefone_Professor" required>
			</div>
            <div class="input-group">
                <label for="cadastro-senha">Senha</label>
                <input type="text" id="cadastro-senha" name="senha_Professor" required>
            </div>
            <button class="createA" type="submit">Criar Conta</button>
            <div class="links-uteis">
                <a href="/login">Já tem uma conta? Faça login</a>
            </div>
        </form>

    </div>
    <div th:if="${erro}" class="error-message">
        <span th:text="${erro}"></span>
</body>
</html>
