<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/components/styles/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/components/styles/styles.css}" rel="stylesheet">
    <title>Login da Instituição</title>
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-card">
        <h2 class="login-title">Instituição</h2>
        <h1 class="login-subtitle">Acesso ao portal</h1>

        <form id="loginForm" th:action="@{/logarInstituicao}" method="post">
            <div class="form-group">
                <label for="username">Email</label>
                <input type="text" name="email" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="text" name="senha"class="form-control" required>
            </div>
            <div>
                <button type="submit" class="btn btn-primary login-button">Entrar</button>
            </div>
        </form>
        </div>
        <div th:if="${erro}" class="error-message">
            <span th:text="${erro}"></span>
        </div>
    </div>

</body>
</html>
