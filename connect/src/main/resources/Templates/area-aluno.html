<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Aluno</title>
    <link th:href="@{/components/styles/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/components/styles/styles.css}" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-white">
    <header class="bg-primary text-white py-3 fixed-top shadow-sm border-bottom border-light">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0 fw-bold">Área do Aluno</h1>
            <a href="/" class="btn btn-danger rounded-pill px-4 fw-bold text-decoration-none text-white">Voltar</a>
        </div>
    </header>

    <div class="mt-5 pt-3"></div>
    
    <main class="container my-4">
        
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form action="/area-aluno" method="get">
                    <div class="input-group">
                        <span class="input-group-text bg-primary text-white">
                            <i data-feather="search"></i>
                        </span>
                        <input type="text" name="busca" class="form-control form-control-lg" placeholder="Pesquisar aluno...">
                        <button class="btn btn-primary text-white" type="submit">
                            <i data-feather="filter"></i> Filtrar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h2 class="h5 mb-0 fw-bold">Alunos Matriculados</h2>
                <a href="/cadastrar-aluno" class="btn btn-light btn-sm fw-bold text-primary">
                    <i data-feather="plus"></i> Novo Aluno
                </a>
            </div>
            <div class="card-body p-0">
                <div class="list-group list-group-flush">
                    
                    <a th:each="aluno : ${alunos}" 
                       th:href="@{/aluno/detalhes/{id}(id=${aluno.idAluno})}" 
                       class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
                        
                        <div>
                            <span class="fw-bold h6 text-dark" th:text="${aluno.nomeAluno}">Nome do Aluno</span>
                            <br>
                            <small class="text-muted">
                                <span th:text="${aluno.grauEnsino}">Série</span> | 
                                <span th:text="${aluno.instituicaoEnsino}">Escola</span>
                            </small>
                        </div>
                        
                        <div class="d-flex align-items-center">
                            <span class="badge bg-success rounded-pill me-3" th:text="${aluno.statusAluno}">ATIVO</span>
                            <i data-feather="chevron-right" class="text-muted"></i>
                        </div>
                    </a>

                    <div th:if="${#lists.isEmpty(alunos)}" class="text-center py-4 text-muted">
                        Nenhum aluno cadastrado ainda.
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script th:src="@{/components/scripts/bootstrap.bundle.min.js}"></script>
    <script>
        feather.replace();
        <form action="/area-aluno" method="get"> <div class="input-group">
        <span class="input-group-text bg-primary text-white">
            <i data-feather="search"></i>
        </span>
        <input type="text" name="busca" class="form-control form-control-lg" placeholder="Pesquisar aluno...">
        <button class="btn btn-primary text-white" type="submit">
            <i data-feather="filter"></i> Filtrar
        </button>
    </div>
</form>
    </script>
</body>
</html>
