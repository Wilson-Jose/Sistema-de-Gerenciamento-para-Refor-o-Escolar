<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Responsável</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="card shadow p-4 bg-white" style="width: 100%; max-width: 600px;">
        <h4 class="text-center mb-4">Novo Responsável</h4>

        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

        <form action="/salvar-responsavel" method="POST" th:object="${responsavel}">
            
            <div class="mb-3">
                <label class="form-label fw-bold">Nome Completo</label>
                <input type="text" th:field="*{nomeResp}" class="form-control" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">CPF</label>
                    <input type="text" th:field="*{cpfResp}" class="form-control" placeholder="Apenas números" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Telefone</label>
                    <input type="text" th:field="*{telResp}" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Email</label>
                <input type="email" th:field="*{emailResp}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Endereço</label>
                <input type="text" th:field="*{endereco}" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success w-100">Salvar Responsável</button>
            <a href="/home" class="btn btn-link w-100 mt-2">Voltar para Home</a>
        </form>
    </div>

</body>
</html>
