<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="card shadow p-4 bg-white" style="width: 100%; max-width: 600px;">
        <h4 class="text-center mb-4">Novo Aluno</h4>

        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

        <form action="/salvar-aluno" method="POST" th:object="${aluno}">
            
            <div class="alert alert-info p-2 mb-3">
                <label class="form-label fw-bold small m-0">CPF do Responsável (Já cadastrado)</label>
                <input type="text" name="cpfResponsavelVinculo" class="form-control mt-1" placeholder="Digite o CPF do pai/mãe para vincular" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Nome do Aluno</label>
                <input type="text" th:field="*{nomeAluno}" class="form-control" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">CPF do Aluno</label>
                    <input type="text" th:field="*{cpfAluno}" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Data de Nascimento</label>
                    <input type="date" th:field="*{dataNascimento}" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Grau de Ensino</label>
                <select th:field="*{grauEnsino}" class="form-select">
                    <option value="Fundamental I">Fundamental I</option>
                    <option value="Fundamental II">Fundamental II</option>
                    <option value="Médio">Ensino Médio</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Escola Anterior</label>
                <input type="text" th:field="*{instituicaoEnsino}" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Observações</label>
                <textarea th:field="*{observacao}" class="form-control" rows="2"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Finalizar Matrícula</button>
            <a href="/home" class="btn btn-link w-100 mt-2">Cancelar</a>
        </form>
    </div>

</body>
</html>
