<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>Novo Aluno</title>

<style>
  body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #e6e6e6;
      padding: 30px;
      border-radius: 15px;
      width: 280px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
      transition: 0.3s;
    }

    h2 {
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      text-align: left;
      font-size: 13px;
      margin: 6px 0 3px;
    }

    input, textarea {
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    textarea {
      resize: none;
      height: 50px;
    }

    .btn-container {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    .btn {
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      flex: 1;
      margin: 0 4px;
    }

    .cancelar { background-color: #e74c3c; }
    .avancar, .finalizar { background-color: #0066cc; }
    .anterior { background-color: #0066cc}

    .cancelar:active, .avancar:active, .finalizar:active, .anterior:active{
    transform: scale(1.085);
    opacity: 0.8; 
    }

    .hidden { display: none; }
</style>

</head>
<body>

  <div class="container">
    <!-- 1°Formulário -->
    <form id="form1">
      <h2>Novo aluno</h2>
      <label>Nome Completo</label>
      <input type="text" required>

      <label>CPF</label>
      <input type="text" required>

      <label>Data de Nascimento</label>
      <input type="date" required>

      <label>Grau de ensino</label>
      <input type="text">

      <label>Instituição de ensino</label>
      <input type="text">

      <label>Observação</label>
      <textarea></textarea>

      <div class="btn-container">
        <button type="button" class="btn cancelar">CANCELAR</button>
        <button type="button" class="btn avancar" onclick="mostrarForm2()">AVANÇAR</button>
      </div>
    </form>

    <!-- 2°Formulário -->
    <form id="form2" class="hidden">
      <h2>Novo aluno</h2>
      <label>Nome do Responsável</label>
      <input type="text" required>

      <label>CPF do Responsável</label>
      <input type="text" required>

      <label>Telefone</label>
      <input type="tel">

      <label>Email</label>
      <input type="email">

      <div class="btn-container">
        <button type="button" class="btn anterior" onclick="mostrarForm1()">ANTERIOR</button>
        <button type="submit" class="btn finalizar">FINALIZAR</button>
      </div>
    </form>
  </div>

<script>
  function mostrarForm2(){
    document.getElementById("form1").classList.add("hidden");
    document.getElementById("form2").classList.remove("hidden");

  }

  function mostrarForm1(){
    document.getElementById("form2").classList.add("hidden");
    document.getElementById("form1").classList.remove("hidden");

  }
</script>

</body>
</html>
