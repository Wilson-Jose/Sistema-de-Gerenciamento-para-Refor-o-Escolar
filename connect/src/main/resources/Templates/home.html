<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Dashboard</title>

    <link th:href="@{/components/styles/bootstrap.min.css}" rel="stylesheet">

    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .hover-card:hover {
            transform: translateY(-5px);
            transition: transform 0.3s ease;
            cursor: pointer;
        }
    </style>
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/index}">Bem Vindo(a) <span th:text="${nome}"></span></a>

            <a th:href="@{/sair}" class="btn btn-danger rounded-circle p-2 ms-auto">
                <i data-feather="log-out"></i>
            </a>
        </div>
    </nav>

    <div class="mt-5 pt-3"></div>

    <main class="container my-4">
        <div class="row g-4">
            
            <div class="col-md-6 col-lg-4">
                <a th:href="@{/cadastrar-responsavel}" class="text-decoration-none">
                    <div class="card bg-success text-white h-100 border-0 shadow-sm hover-card">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
                            <div class="icon-circle mb-3">
                                <i data-feather="user" class="feather-lg"></i>
                            </div>
                            <h5 class="card-title text-uppercase fw-bold">1. CADASTRAR</h5>
                            <h5 class="card-title text-uppercase fw-bold">RESPONSÁVEL</h5>
                            <p class="small mb-0 opacity-75">(Passo Obrigatório)</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-4">
                <a th:href="@{/cadastrar-aluno}" class="text-decoration-none">
                    <div class="card bg-primary text-white h-100 border-0 shadow-sm hover-card">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
                            <div class="icon-circle mb-3">
                                <i data-feather="user-plus" class="feather-lg"></i>
                            </div>
                            <h5 class="card-title text-uppercase fw-bold">2. CADASTRAR</h5>
                            <h5 class="card-title text-uppercase fw-bold">NOVO ALUNO</h5>
                            <p class="small mb-0 opacity-75">(Requer Responsável)</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-4">
                <a th:href="@{/area-aluno}" class="text-decoration-none">
                    <div class="card bg-primary text-white h-100 border-0 shadow-sm hover-card">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
                            <i data-feather="users" class="feather-lg mb-3"></i>
                            <h5 class="card-title text-uppercase fw-bold">ÁREA DO</h5>
                            <h5 class="card-title text-uppercase fw-bold">ALUNO</h5>
                            <p class="small mb-0 opacity-75">(Listagem e Busca)</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-4">
                <a th:href="@{/horarioProf}" class="text-decoration-none">
                    <div class="card bg-primary text-white h-100 border-0 shadow-sm hover-card">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
                            <i data-feather="calendar" class="feather-lg mb-3"></i>
                            <h5 class="card-title text-uppercase fw-bold">AGENDA</h5>
                            <p class="small mb-0 opacity-0">.</p> </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-4">
                <a th:href="@{/exportFicha}" class="text-decoration-none">
                    <div class="card bg-primary text-white h-100 border-0 shadow-sm hover-card">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
                            <div class="icon-circle mb-3">
                                <i data-feather="file-text" class="feather-lg"></i>
                            </div>
                            <h5 class="card-title text-uppercase fw-bold">EMITIR RELATÓRIO</h5>
                            <h5 class="card-title text-uppercase fw-bold">ALUNO</h5>
                            <p class="small mb-0 opacity-75">(Ficha Completa)</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-4">
                <div class="card bg-secondary text-white h-100 border-0 shadow-sm">
                    <div class="card-body d-flex align-items-center justify-content-center text-center p-4">
                        <h5 class="card-title text-uppercase fw-bold">EM BREVE</h5>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script th:src="@{/components/scripts/bootstrap.bundle.min.js}"></script>

    <script>
        feather.replace();
    </script>

</body>

</html>
