# --- Configuração do Banco de Dados (MySQL) ---
# Endereço do banco (cria o banco 'reforco_escolar' se não existir)
spring.datasource.url=jdbc:mysql://localhost:3306/reforco_escolar?createDatabaseIfNotExist=true&serverTimezone=UTC

# Usuário do banco (geralmente é 'root')
spring.datasource.username=root

# --- IMPORTANTE: Coloque a SUA senha do MySQL aqui em baixo ---
spring.datasource.password=

# Driver de conexão
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuração do Hibernate (JPA) ---
# Atualiza as tabelas automaticamente (cria se não existirem)
spring.jpa.hibernate.ddl-auto=update

# Mostra os comandos SQL no console (bom para ver o que está acontecendo)
spring.jpa.show-sql=true

# Formata o SQL para ficar mais legível
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do MySQL (ajuda o Java a falar a "língua" certa do banco)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect