<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno</title>
    <link href="../static/components/styles/bootstrap.min.css" th:href="@{/components/styles/bootstrap.min.css}" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-white">
    <header class="bg-primary text-white py-3 fixed-top shadow-sm border-bottom border-light">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0 fw-bold">Área do Aluno</h1>
            <a href="/" class="btn btn-danger rounded-pill px-4 fw-bold text-white text-decoration-none">Voltar</a>
        </div>
    </header>

    <div class="mt-5 pt-3"></div>

    <main class="container my-4">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-8">
                        <div class="input-group">
                            <span class="input-group-text bg-primary text-white">
                                <i data-feather="search"></i>
                            </span>
                            <input type="text" class="form-control form-control-lg" placeholder="Pesquisar aluno...">
                            <button class="btn btn-primary text-white">
                                <i data-feather="filter"></i> Filtrar
                            </button>
                        </div>
                    </div>
                    <div class="col-md-4 text-end">
                        <a href="/cadastrar-aluno" class="btn btn-success btn-lg w-100 fw-bold text-white">
                            <i data-feather="plus-circle"></i> Novo Aluno
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0 h5">Alunos Matriculados</h2>
            </div>
            <div class="card-body p-0">
                <div class="list-group list-group-flush">
                    
                    <div th:if="${alunos.empty}" class="p-4 text-center text-muted">
                        <i data-feather="users" style="width: 48px; height: 48px; opacity: 0.5"></i>
                        <p class="mt-2">Nenhum aluno cadastrado ainda.</p>
                    </div>

                    <a th:each="aluno : ${alunos}" href="#" class="list-group-item list-group-item-action p-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-1 fw-bold text-primary" th:text="${aluno.nomeAluno}">Nome do Aluno</h5>
                                <p class="mb-1 small text-muted">
                                    <i data-feather="user" style="width: 14px"></i> Responsável: <span th:text="${aluno.nomeResponsavel}">Nome Resp</span>
                                    | 
                                    <i data-feather="phone" style="width: 14px"></i> <span th:text="${aluno.telefoneResponsavel}">Tel</span>
                                </p>
                            </div>
                            <i data-feather="chevron-right" class="text-muted"></i>
                        </div>
                    </a>

                </div>
            </div>
        </div>
    </main>

    <script src="../static/components/scripts/bootstrap.bundle.min.js" th:src="@{/components/scripts/bootstrap.bundle.min.js}"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
