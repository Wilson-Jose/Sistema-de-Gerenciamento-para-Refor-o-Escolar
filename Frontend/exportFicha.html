<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./style.css">
<title>Emitir Relatório</title>

<style>
    body {
        background: #ffffff;
        display: flex;
        justify-content: center;
        padding-top: 50px;
        font-family: Arial, sans-serif;
    }

    .box {
        width: 350px;
        background: #eaeaea;
        padding: 35px 30px;
        border-radius: 20px;
        text-align: left;
        box-shadow: 0px 2px 10px rgba(0,0,0,0.2);
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    label {
        font-size: 14px;
        font-weight: bold;
        display: block;
        margin-top: 10px;
    }

    input {
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #888;
        margin-top: 5px;
        margin-bottom: 10px;
    }

    .btn-area {
        margin-top: 15px;
        display: flex;
        justify-content: space-between;
        transform: scale(1.085);

    }

    .Btncancelar {
        background-color: #f44336;
        color: white;
        padding: 10px 25px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 15px;
        transform: scale(1.085);
    }

    .Btnexportar {
        background-color: #004aad;
        color: white;
        padding: 10px 25px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
        transform: scale(1.085);
    }
</style>

</head>
<body>

<div class="box">
    <h1>Emitir relatório</h1>

    <label>Nome do aluno</label>
    <input type="text">

    <label>Data de Nascimento</label>
    <input type="date">

    <div class="btn-area">
        <button class="Btncancelar" onclick = "location.assign('ficha.html')">Cancelar</button>
        <button class="Btnexportar">
            Exportar
        </button>
    </div>
</div>

</body>
</html>
